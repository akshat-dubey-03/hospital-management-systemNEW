version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: medicore_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: medicore_db
      POSTGRES_USER: medicore_user
      POSTGRES_PASSWORD: medicore_pass
    ports:
      - '5432:5432'
    volumes:
      - medicore_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U medicore_user -d medicore_db']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  medicore_pgdata:
    driver: local
